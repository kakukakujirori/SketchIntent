# @package _global_

model:
  num_heads: 8
  num_layers: 12
  hidden_size: 384
  embedding_dimension: 256
  num_positional_embeddings: 16

optim:
  learning_rate: 3e-5

data:
  sequence_path: data_processed/sg_filtered_unique.npy  # cptsketchgraphs.npy
  primitive_noise:
    enabled: True

mixed_precision: True
batch_size: 384
num_gpus: 2

max_epochs: 30
num_data_workers: 32
