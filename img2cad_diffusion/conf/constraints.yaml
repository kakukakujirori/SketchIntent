# @package _global_

model:
  token_masking_strategies: ["4-tokenwise-causal"]
  token_masking_probs: ["antithetic"]
  gt_reordering_strategies: ["hungarian_frontier"]
  net:
    model_type: mdd_with_cnt  # "ar" or "mdd"
    num_heads: 8
    num_layers: 12
    hidden_size: 384
    embedding_dimension: 256

optim:
  learning_rate: 3e-4 #3e-5

data:
  num_position_bins: 64
  sequence_path: data_processed/sg_filtered_unique.npy  # cptsketchgraphs.npy
  fc_clusters_path: scripts/sketchgraphs_fc_search/sketchgraphs_fc_clustered.json
  max_token_length: 130
  validation_fraction: 0.025
  test_fraction: 0.05
  permute_entities: false
  primitive_noise:
    enabled: True
    std: 0.15
    max_difference: 0.15
  align_constraint_token_length: True  # If True, each constraint uses exactly 4 tokens
  use_stop_padding: True  # If True, pad with STOP tokens (required for Hungarian matching)
  constraint_order: random_shuffle  # "original", "sort_by_ref_id", or "random_shuffle"
  batch_size: 256
  num_data_workers: 32

sampling:
  steps: 64
  method: frontier_tau_leaping

mixed_precision: True
num_gpus: 2
training_seed: 42  # Seed for training randomness (model init, dropout, etc.)

max_epochs: 30

