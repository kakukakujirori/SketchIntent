_target_: src.models.constraint_ar_module_rloo.ConstraintARModuleRLOO

context: ${data.context}

model:
  _target_: src.models.components.constraint_ar_model.ConstraintARModel
  num_bins: ${data.context.num_quantization_bins}
  max_token_length: ${data.context.max_token_length}
  embed_dim: 256
  feedforward_dim: 384
  num_heads: 8
  num_layers: 12
  dropout: 0.0

reward_composer:
  _target_: src.models.rewards.composer.RewardComposer
  rewards:
    # Solver-derived hard signals (FC / DoF / per-constraint penalties).
    - _target_: src.models.rewards.solver_reward.SolverReward
      context: ${data.context}
      reward_dof_reduction: 10.0
      reward_fully_constrained: 5.0
      penalty_conflicting: -1.0
      penalty_redundant: -1.0
      penalty_malformed: -0.5
      penalty_deformed: -0.25
      penalty_per_problematic_constraint: -1.0
      penalty_rigid_dimensional: -0.0
      fully_constrained_dof: 2
      distortion_threshold: null

    # Dimensional parsimony — single home for the dim-count penalty that
    # previously lived in both SolverReward and RelStructReward.
    - _target_: src.models.rewards.dim_parsimony.DimParsimonyReward
      context: ${data.context}
      coeff: 0.30
      mode: excess_over_gt_per_primitive
      excess_margin: 1
      gate: converged

    # Response-metric reward (canonical Hθ surrogate d_H_relstruct_angle by default).
    - _target_: src.models.rewards.response_metric_reward.ResponseMetricReward
      context: ${data.context}
      eps: 1.0e-9
      coeff_h_angle: 2.0
      cap_h_angle: 1.0
      h_angle_reward_metric: d_H_relstruct_angle  # d_H_relstruct_angle | d_relstruct | leak_angle | d_H_angle | d_sub_angle
      relstruct_distance_mode: symmetric          # symmetric | pred_subset_gt | mixed_subset
      relstruct_reverse_weight: 0.5
      coeff_d_svd: 1.0
      cap_d_svd: 1.0
      d_svd_metric: d_SVD_sub_trunc
      d_svd_probe_source: gt_dim
      tau_p: 0.01
      use_h_angle: true
      use_d_svd: false

    # Intrinsic-size attainability bonus (gain_intrinsic). Disabled by
    # default; enable after smoke-testing the canonical Hθ surrogate.
    - _target_: src.models.rewards.gain_intrinsic.GainIntrinsicReward
      context: ${data.context}
      coeff: 3.0
      cap: 0.5
      gate: fc
      enabled: false

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 1.0e-5

scheduler:
  _target_: torch.optim.lr_scheduler.ConstantLR
  _partial_: true
  factor: 0.3333333333333333
  total_iters: 5

ref_update_steps: 100
group_sample_size: 8
entropy_bonus: 0.0
kl_coeff: 0.01
sft_coeff: 0.0
