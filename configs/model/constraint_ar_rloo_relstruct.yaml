_target_: src.models.constraint_ar_module_rloo.ConstraintARModuleRLOO

context: ${data.context}

model:
  _target_: src.models.components.constraint_ar_model.ConstraintARModel
  num_bins: ${data.context.num_quantization_bins}
  max_token_length: ${data.context.max_token_length}
  embed_dim: 256
  feedforward_dim: 384
  num_heads: 8
  num_layers: 12
  dropout: 0.0

reward:
  _target_: src.models.components.solver_reward.SolverReward
  context: ${data.context}
  reward_dof_reduction: 10.0
  reward_fully_constrained: 5.0
  penalty_conflicting: -1.0
  penalty_redundant: -1.0
  penalty_malformed: -0.5
  penalty_deformed: -0.25
  penalty_per_problematic_constraint: -1.0
  penalty_num_total_constraints: -0.1
  # Auto-zeroed at runtime when relstruct_reward.use_dim_penalty=true
  # (see ConstraintARModuleRLOO.__init__)
  penalty_num_dimensional_constraints: -0.1
  penalty_rigid_dimensional: -0.0
  fully_constrained_dof: 2
  distortion_threshold: null

# Plan A″ reward (staged rollout — start with leak+relstruct, add gain later)
relstruct_reward:
  _target_: src.models.components.relstruct_reward.RelStructReward
  context: ${data.context}
  eps: 1.0e-9
  # leak_prime: FC gate — relation preservation (one-sided, safest first component)
  coeff_leak: 5.0
  cap_leak: 0.3
  # d_relstruct: Converged gate — relation structure both-sided match
  coeff_relstruct: 3.0
  cap_relstruct: 0.6
  # gain_intrinsic: FC gate — dim naturalness (gameable; add after smoke test)
  coeff_gain: 3.0
  cap_gain: 0.5
  # dim penalty: Converged gate (set use_dim_penalty=true only after gain is stable)
  coeff_dim_penalty: 0.05
  # Staged rollout toggles — step 1: leak only
  use_leak: true
  use_relstruct: false   # enable after d_relstruct smoke test passes
  use_gain: false        # enable last
  use_dim_penalty: false # enable last; SolverReward.penalty_num_dimensional_constraints
                         # is auto-zeroed when true (see module __init__)

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 1.0e-5

scheduler:
  _target_: torch.optim.lr_scheduler.ConstantLR
  _partial_: true
  factor: 0.3333333333333333
  total_iters: 5

ref_update_steps: 100
group_sample_size: 8
entropy_bonus: 0.0
kl_coeff: 0.01
sft_coeff: 0.0
gt_reward_coeff: 0.0
penalty_duplicate: -1.0
