# @package _global_
#
# ===== Appendix probe: +L only (LeakAngle, no MotionAngle) =====
# = FINAL full-stack config rloo_response_scaffold12_m4.5_l1.5_leakdof_dimprior_intent
# with MotionAngleReward REMOVED and LeakAngleReward(coeff 1.5, gate=dof) kept.
# This isolates whether direction-aware dimensional substitution penalty alone can
# improve independent metrics (distFam/asgn/raw Distance) without the relational
# motion target. Expectation: useful as reviewer-facing appendix, but not a main arm:
# leak can penalize bad dimensional drivers, yet it does not directly add a dense
# signal for which relational constraints should be emitted.
#
# Smoke (CPU, 2 steps; avoids spawning SolverReward workers and W&B online run):
#   conda run -n freecad python src/train.py experiment=rloo_response_scaffold12_ablA_l1.5_leakdof_dimprior_intent \
#     trainer.accelerator=cpu trainer.devices=1 trainer.strategy=auto trainer.precision=32 \
#     data.batch_size=1 model.group_sample_size=3 model.reward_composer.rewards.0.num_workers=0 \
#     +trainer.max_steps=2 +trainer.limit_val_batches=0 +trainer.num_sanity_val_steps=0 +logger.wandb.mode=offline
# Launch: conda run -n freecad python src/train.py experiment=rloo_response_scaffold12_ablA_l1.5_leakdof_dimprior_intent trainer.devices=[N]

defaults:
  - rloo_response_scaffold12_m4.5_l1.5_leakdof_dimprior_intent
  - _self_

tags: ["rloo", "response", "scaffold12", "ablationA", "leak_only", "intent"]

model:
  reward_composer:
    _target_: src.models.rewards.composer.RewardComposer
    rewards:
      - _target_: src.models.rewards.solver_reward.SolverReward
        context: ${data.context}
        reward_dof_reduction: 4.0
        reward_fully_constrained: 1.5
        penalty_conflicting: -1.0
        penalty_redundant: -1.0
        penalty_malformed: -0.5
        penalty_deformed: -0.25
        penalty_per_problematic_constraint: -1.0
        penalty_rigid_dimensional: -0.0
        fully_constrained_dof: 2
        distortion_threshold: null
        penalty_near_zero_distance: -1.5
        near_zero_distance_threshold: 0.001
        near_zero_distance_cap: 3
        near_zero_distance_gate: converged
        penalty_axis_angle: -1.5
        axis_angle_tolerance_rad: 0.001
        axis_angle_cap: 3
        axis_angle_gate: converged
        num_workers: null

      - _target_: src.models.rewards.relational_class_prior.RelationalClassPriorReward
        context: ${data.context}
        gate: converged
        cap_total: 1.0
        cap_per_type: 3
        coeff_by_type:
          Mirror: 0.15
          Equal: 0.129
          Concentric: 0.055
          Parallel: 0.053
          Perpendicular: 0.046
          Tangent: 0.048
          Coincident: 0.012
          Horizontal: 0.042
          Vertical: 0.05
          Midpoint: 0.112

      - _target_: src.models.rewards.dimensional_class_prior.DimensionalClassPriorReward
        context: ${data.context}
        gate: converged
        cap_positive_total: 0.10
        cap_negative_total: -0.20
        cap_per_type: 3
        coeff_by_type:
          Distance: -0.03
          DistanceX: 0.02
          DistanceY: 0.02
          Angle: -0.05

      - _target_: src.models.rewards.response_metric_reward.ResponseMetricEvaluator
        context: ${data.context}
        eps: 1.0e-9
        motion_relational_angle_mode: symmetric
        motion_relational_reverse_weight: 0.5
        gate: converged
        num_workers: 4

      # +L only: no MotionAngleReward. Leak is ramped by dof_reduction_rate.
      - _target_: src.models.rewards.response_metric_reward.LeakAngleReward
        coeff: 1.5
        cap: 0.70
        gate: dof
