# @package _global_
#
# ===== Prefix-motion+leak credit-assignment arm (+M + PrefixMotion + PrefixLeak) =====
# = the PrefixMotion arm (see ..._prefixmotion_intent) PLUS a PrefixLeakAngleReward:
# the shared PrefixResponseMetricEvaluator producer computes BOTH motion and leak per
# prefix in one sketch/native rebuild, then PrefixMotionAngleReward places positive
# motion deltas at every block tail and PrefixLeakAngleReward places an increase-only
# leak penalty at DIMENSIONAL block tails. This adds local credit for the dimensional
# substitution that first introduces a relation-violating motion direction, instead of
# only scoring leak on the final sketch (the full-sequence LeakAngleReward).
#
# Run AFTER the motion-only prefix arm: prefix leak is the +L analogue and its effect
# is read on top of prefix motion (mirrors the §4.7 finding that leak compensates FC).
#
# Monitor for count-hack (prefix_motion_last_angle_mean falling without distFam/raw
# Distance blowing up) AND for dimension avoidance from the leak penalty (val_cmix
# DistanceX/Y and FC must not collapse; lower coeff_leak if so).
#
# Smoke (CPU, 2 steps):
#   conda run -n freecad python src/train.py experiment=rloo_response_scaffold13_ablA_m4.5_dimprior_prefixmotionleak_intent \
#     trainer.accelerator=cpu trainer.devices=1 trainer.strategy=auto trainer.precision=32 \
#     data.batch_size=1 model.group_sample_size=3 \
#     +trainer.max_steps=2 +trainer.limit_val_batches=0 +trainer.num_sanity_val_steps=0
# Launch: conda run -n freecad python src/train.py experiment=rloo_response_scaffold13_ablA_m4.5_dimprior_prefixmotionleak_intent trainer.devices=[N]

defaults:
  - override /data: constraint_rloo.yaml
  - override /model: constraint_ar_rloo.yaml
  - override /trainer: default

tags: ["rloo", "response", "scaffold13", "ablationA", "prefix_motion", "prefix_leak", "intent"]

callbacks:
  model_checkpoint_epoch:
    every_n_train_steps: 100
    save_top_k: 3
    filename: "epoch_{epoch}_step_{step}"
    save_last: true

  model_checkpoint_loss: null

  model_checkpoint_reward:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    dirpath: ${paths.output_dir}/checkpoints
    monitor: "validation_gen/solver_valid_dof_mean"
    filename: "step_{step}_dof_{validation_gen/solver_valid_dof_mean:.3f}"
    save_top_k: 3
    mode: "min"
    auto_insert_metric_name: false
    every_n_train_steps: 100

  # Fixed-interval, NON-overwriting checkpoints for matched-step ablation eval.
  model_checkpoint_step:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    dirpath: ${paths.output_dir}/checkpoints
    filename: "stepsave_{step}"
    every_n_train_steps: 5000
    save_top_k: -1
    save_last: false
    auto_insert_metric_name: false

data:
  train_sequence_file: data_processed/sg_pseudo_rel_v2_full_all_full.npy
  batch_size: 32
  num_workers: 1

model:
  flip_augment_axes: [x, y]
  group_sample_size: 9

  entropy_bonus: 0.005
  train_sample_temperature: 1.2
  val_sample_temperature: 1.0

  reward_composer:
    _target_: src.models.rewards.composer.RewardComposer
    rewards:
      - _target_: src.models.rewards.solver_reward.SolverReward
        context: ${data.context}
        reward_dof_reduction: 4.0
        reward_fully_constrained: 1.5
        penalty_conflicting: -1.0
        penalty_redundant: -1.0
        penalty_malformed: -0.5
        penalty_deformed: -0.25
        penalty_per_problematic_constraint: -1.0
        penalty_rigid_dimensional: -0.0
        fully_constrained_dof: 2
        distortion_threshold: null
        penalty_near_zero_distance: -1.5
        near_zero_distance_threshold: 0.001
        near_zero_distance_cap: 3
        near_zero_distance_gate: converged
        penalty_axis_angle: -1.5
        axis_angle_tolerance_rad: 0.001
        axis_angle_cap: 3
        axis_angle_gate: converged
        num_workers: null

      # DimParsimony DROPPED (its on/off lives in arm 3).

      - _target_: src.models.rewards.relational_class_prior.RelationalClassPriorReward
        context: ${data.context}
        gate: converged
        cap_total: 1.0
        cap_per_type: 3
        coeff_by_type:
          Mirror: 0.15
          Equal: 0.129
          Concentric: 0.055
          Parallel: 0.053
          Perpendicular: 0.046
          Tangent: 0.048
          Coincident: 0.012
          Horizontal: 0.042
          Vertical: 0.05
          Midpoint: 0.112

      - _target_: src.models.rewards.dimensional_class_prior.DimensionalClassPriorReward
        context: ${data.context}
        gate: converged
        cap_positive_total: 0.10
        cap_negative_total: -0.20
        cap_per_type: 3
        coeff_by_type:
          Distance: -0.03
          DistanceX: 0.02
          DistanceY: 0.02
          Angle: -0.05

      - _target_: src.models.rewards.response_metric_reward.ResponseMetricEvaluator
        context: ${data.context}
        eps: 1.0e-9
        motion_relational_angle_mode: symmetric
        motion_relational_reverse_weight: 0.5
        gate: converged
        num_workers: 4
      # +M: motion_relational_angle reward only (no Leak).
      - _target_: src.models.rewards.response_metric_reward.MotionAngleReward
        coeff: 4.5
        cap: 0.70
        gate: converged
      # +PrefixMotion: prefix-shaped credit assignment for motion_relational_angle.
      # Producer/consumer split (mirrors ResponseMetricEvaluator + MotionAngleReward):
      # the producer re-evaluates motion (+ leak) per prefix once and caches the
      # trajectory; the consumer turns it into per-block deltas. Mode A (positive
      # delta) on top of the STOP MotionAngle, PLUS a PrefixLeak penalty consuming
      # the same producer trajectory.
      - _target_: src.models.rewards.response_metric_reward.PrefixResponseMetricEvaluator
        context: ${data.context}
        eps: 1.0e-9
        motion_relational_angle_mode: symmetric
        motion_relational_reverse_weight: 0.5
        gate: converged
        max_prefixes: 12
        num_workers: 4
      - _target_: src.models.rewards.response_metric_reward.PrefixMotionAngleReward
        coeff: 1.0
        cap: 0.70
        gate: converged
        delta_mode: positive
        min_delta: 0.02
      # +PrefixLeak: increase-only penalty at dimensional block tails, consuming
      # the same producer trajectory (no extra prefix rebuild). gate=converged is
      # safe (penalty-only, no no-dims bonus). Small coeff to avoid dim avoidance.
      - _target_: src.models.rewards.response_metric_reward.PrefixLeakAngleReward
        coeff: 0.5
        cap: 0.70
        gate: converged
        min_delta: 0.01

  reward_val_composer:
    _target_: src.models.rewards.composer.RewardValComposer
    context: ${data.context}
    metrics:
      - _target_: src.models.rewards.solver_reward.SolverReward
        context: ${data.context}
        fully_constrained_dof: 2
        penalty_near_zero_distance: 0.0
        near_zero_distance_threshold: 0.001
        penalty_axis_angle: 0.0
        axis_angle_tolerance_rad: 0.001
        num_workers: null
      - _target_: src.models.rewards.response_metric_reward.ResponseMetricEvaluator
        context: ${data.context}
        eps: 1.0e-9
        gate: always
        num_workers: 0
      - _target_: src.models.rewards.relational_class_prior.RelationalClassPriorReward
        context: ${data.context}
        gate: always
        cap_total: 1.0
        cap_per_type: 3
        coeff_by_type:
          Mirror: 0.15
          Equal: 0.129
          Concentric: 0.055
          Parallel: 0.053
          Perpendicular: 0.046
          Tangent: 0.048
          Coincident: 0.012
          Horizontal: 0.042
          Vertical: 0.05
          Midpoint: 0.112

  optimizer:
    lr: 1e-5

trainer:
  check_val_every_n_epoch: null
  val_check_interval: 100
  devices: 1
  max_epochs: 3

pretrained_ckpt_path: logs/train/runs/2026-05-02_20-35-42/checkpoints/epoch_29.ckpt
