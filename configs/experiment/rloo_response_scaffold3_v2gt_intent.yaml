# @package _global_

# scaffold-v3 PROBE (C) — v2 GT axis (rule-augmenter pseudo-rel GT), BASE reward stack.
#
# Purpose: isolate the EFFECT OF THE GT alone.  This is scaffold2_intent's reward
# stack EXACTLY, with only the training reward GT swapped from v1
# (sg_pseudo_rel_167k, model-generated, per-sketch INCOMPLETE) to v2
# (rule-augmenter output, per-sketch COMPLETE: every geometrically-true
# Tangent/Perp/Equal/Parallel pair added).  Comparing to scaffold2_intent (v1 GT,
# same stack) attributes any change to the GT, forming a clean 2x2 with probe A:
#     GT \ reward |   base (this/scaffold2)   |  reward-balance (probe A / D)
#     v1          |   scaffold2_intent (run)  |  scaffold3_rewardbalance_intent
#     v2          |   THIS                    |  scaffold3_rewardbalance_v2gt_intent
#
# What the v2 GT does / does NOT do (per the 2026-05-31 diagnostics, §14.7.5):
#   * DOES: make the d_H_angle reward TARGET per-sketch complete for the
#     non-substitutable types (Tangent/Perp/Equal) — the motion subspace reward
#     reduces the redundant augmented set to its rank (redundancy inert), and the
#     target pins MORE relations than v1 (motion dim ~8.5->5.5), so the reward now
#     points at the relations the figure actually has.  Complements probe A.
#   * Does NOT help Parallel: #2 proved d_H_angle is gauge-invariant (H+H == Parallel),
#     so the v2 GT's Parallel 9%->19% boost is inert.  (Benign, redundancy-absorbed.)
#   * Mirror/Concentric: only the augmenter can add them (H4).  This config uses the
#     no_mirror variant by default (full_all's Mirror 19% is precision ~0.006 = mostly
#     FP); swap train_sequence_file to sg_pseudo_rel_v2_full_all.npy for the Mirror ablation.
#
# Note: v2 GT has ~57 constr/sketch (vs v1 ~19); benign — reward uses the datalib.Sketch
# object (full), c_val>192 truncation only hits CE/SFT/GTMatch which are off here
# (verified: rule-augmenter-and-gate pipeline-safety trace + canary 2000->1990).
#
# Smoke test (CPU, 2 steps):
#   conda run -n freecad python src/train.py experiment=rloo_response_scaffold3_v2gt_intent \
#     trainer.accelerator=cpu trainer.devices=1 trainer.strategy=auto trainer.precision=32 \
#     data.batch_size=1 model.group_sample_size=2 \
#     +trainer.max_steps=2 +trainer.limit_val_batches=0 +trainer.num_sanity_val_steps=0
# Launch (GPU): conda run -n freecad python src/train.py experiment=rloo_response_scaffold3_v2gt_intent

defaults:
  - override /data: constraint_rloo.yaml
  - override /model: constraint_ar_rloo.yaml
  - override /trainer: default

tags: ["rloo", "response", "scaffold3", "v2gt", "intent", "probe"]

callbacks:
  model_checkpoint_epoch:
    every_n_train_steps: 100
    save_top_k: 3
    filename: "epoch_{epoch}_step_{step}"
    save_last: true

  model_checkpoint_loss: null

  model_checkpoint_reward:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    dirpath: ${paths.output_dir}/checkpoints
    monitor: "validation_gen/solver_valid_dof_mean"
    filename: "step_{step}_dof_{validation_gen/solver_valid_dof_mean:.3f}"
    save_top_k: 3
    mode: "min"
    auto_insert_metric_name: false
    every_n_train_steps: 100

data:
  # v2 rule-augmenter GT (per-sketch complete). Swap to sg_pseudo_rel_v2_full_all.npy
  # for the Mirror ablation.
  train_sequence_file: data_processed/sg_pseudo_rel_v2_no_mirror.npy
  batch_size: 32
  num_workers: 1

model:
  # Exploration knobs IDENTICAL to scaffold2_intent (this axis changes only the GT).
  entropy_bonus: 0.005
  train_sample_temperature: 1.2
  val_sample_temperature: 1.0

  reward_composer:
    _target_: src.models.rewards.composer.RewardComposer
    rewards:
      - _target_: src.models.rewards.solver_reward.SolverReward
        context: ${data.context}
        reward_dof_reduction: 10.0
        reward_fully_constrained: 5.0
        penalty_conflicting: -1.0
        penalty_redundant: -1.0
        penalty_malformed: -0.5
        penalty_deformed: -0.25
        penalty_per_problematic_constraint: -1.0
        penalty_rigid_dimensional: -0.0
        fully_constrained_dof: 2
        distortion_threshold: null
        penalty_near_zero_distance: -1.5
        near_zero_distance_threshold: 0.001
        near_zero_distance_cap: 3
        near_zero_distance_gate: converged
        penalty_axis_angle: -1.5
        axis_angle_tolerance_rad: 0.001
        axis_angle_cap: 3
        axis_angle_gate: converged
        num_workers: null

      - _target_: src.models.rewards.dim_parsimony.DimParsimonyReward
        context: ${data.context}
        coeff: 0.30
        mode: excess_over_gt_per_primitive
        excess_margin: 1
        gate: converged

      - _target_: src.models.rewards.relational_class_prior.RelationalClassPriorReward
        context: ${data.context}
        gate: converged
        cap_total: 1.0
        cap_per_type: 3
        coeff_by_type:
          Mirror: 0.15
          Equal: 0.129
          Concentric: 0.055
          Parallel: 0.053
          Perpendicular: 0.046
          Tangent: 0.048
          Coincident: 0.012
          Horizontal: 0.042
          Vertical: 0.05
          Midpoint: 0.112

      - _target_: src.models.rewards.response_metric_reward.ResponseIntentReward
        context: ${data.context}
        eps: 1.0e-9
        coeff_h_angle: 3.0
        cap_h_angle: 0.70
        h_angle_reward_metric: motion_relational_angle
        motion_relational_angle_mode: symmetric
        motion_relational_reverse_weight: 0.5
        gate: converged
        num_workers: 4

  reward_val_composer:
    _target_: src.models.rewards.composer.RewardValComposer
    context: ${data.context}
    metrics:
      - _target_: src.models.rewards.solver_reward.SolverReward
        context: ${data.context}
        fully_constrained_dof: 2
        penalty_near_zero_distance: 0.0
        near_zero_distance_threshold: 0.001
        penalty_axis_angle: 0.0
        axis_angle_tolerance_rad: 0.001
        num_workers: null
      - _target_: src.models.rewards.response_metric_reward.ResponseIntentReward
        context: ${data.context}
        eps: 1.0e-9
        gate: always
        h_angle_reward_metric: response_full_angle
        num_workers: 0
      - _target_: src.models.rewards.relational_class_prior.RelationalClassPriorReward
        context: ${data.context}
        gate: always
        cap_total: 1.0
        cap_per_type: 3
        coeff_by_type:
          Mirror: 0.15
          Equal: 0.129
          Concentric: 0.055
          Parallel: 0.053
          Perpendicular: 0.046
          Tangent: 0.048
          Coincident: 0.012
          Horizontal: 0.042
          Vertical: 0.05
          Midpoint: 0.112

  optimizer:
    lr: 1e-5

trainer:
  check_val_every_n_epoch: null
  val_check_interval: 100
  devices: 1
  max_epochs: 3

pretrained_ckpt_path: logs/train/runs/2026-05-02_20-35-42/checkpoints/epoch_29.ckpt
