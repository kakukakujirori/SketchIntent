# @package _global_

# scaffold-v2 + ResponseIntentReward, trained against pseudo-GT v2 full closure
# from the rule augmenter.  This is the "full_all" arm: Mirror is included, so
# compare against rloo_response_scaffold2_intent_v2_no_mirror.yaml to isolate
# Mirror over-completion effects.

defaults:
  - rloo_response_scaffold2_intent
  - _self_

tags: ["rloo", "response", "scaffold2", "intent", "pseudo_rel_v2", "full_all"]

data:
  train_sequence_file: data_processed/sg_pseudo_rel_v2_full_all.npy
