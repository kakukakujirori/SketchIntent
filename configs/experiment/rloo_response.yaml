# @package _global_

# RLOO with response-intent reward + dimensional parsimony, composed via RewardComposer.
#
# Reward stack:
#   0. SolverReward          — FC / DoF / per-constraint penalties
#   1. DimParsimonyReward    — GT-excess dim hinge (Converged gate)
#   2. ResponseIntentReward  — response_relational_angle (logged under intent_*)
#   3. GainIntrinsicReward   — intrinsic-size attainability (disabled by default)
#
# Override individual rewards by list index, e.g.
#   model.reward_composer.rewards.2.h_angle_reward_metric=response_full_angle
#   model.reward_composer.rewards.3.enabled=true
#
# Smoke test (CPU, 2 steps):
#   conda run -n freecad python src/train.py experiment=rloo_response \
#     trainer.accelerator=cpu trainer.devices=1 trainer.strategy=auto trainer.precision=32 \
#     data.batch_size=1 model.group_sample_size=2 \
#     +trainer.max_steps=2 +trainer.limit_val_batches=0 +trainer.num_sanity_val_steps=0

defaults:
  - override /data: constraint_rloo.yaml
  - override /model: constraint_ar_rloo.yaml
  - override /trainer: default

tags: ["rloo", "response"]

callbacks:
  model_checkpoint_epoch:
    every_n_train_steps: 100
    save_top_k: 3
    filename: "epoch_{epoch}_step_{step}"

  model_checkpoint_loss: null

  model_checkpoint_reward:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    dirpath: ${paths.output_dir}/checkpoints
    monitor: "validation_gen/solver_fc_rate"
    filename: "step_{step}_fc_{validation_gen/solver_fc_rate:.3f}"
    save_top_k: 3
    mode: "max"
    auto_insert_metric_name: false
    every_n_train_steps: 100

data:
  # Pseudo-relational dataset generated by scripts/generate_pseudo_rel_dataset.py.
  # Each sketch in this npy carries model-predicted relational constraints as GT,
  # providing a denser R_G (preservation set) for the d_feas leak signal.
  # Generation: ~30 h on cuda:1 → PID 1849277 (started 2026-05-18).
  train_sequence_file: data_processed/sg_pseudo_rel_167k_unique_valid.npy
  batch_size: 32
  num_workers: 1

model:
  reward_composer:
    _target_: src.models.rewards.composer.RewardComposer
    rewards:
      # Solver-derived hard signals (FC / DoF / per-constraint penalties).
      - _target_: src.models.rewards.solver_reward.SolverReward
        context: ${data.context}
        reward_dof_reduction: 10.0
        reward_fully_constrained: 5.0
        penalty_conflicting: -1.0
        penalty_redundant: -1.0
        penalty_malformed: -0.5
        penalty_deformed: -0.25
        penalty_per_problematic_constraint: -1.0
        penalty_rigid_dimensional: -0.0
        fully_constrained_dof: 2
        distortion_threshold: null

      # Dimensional parsimony (dim-count penalty)
      - _target_: src.models.rewards.dim_parsimony.DimParsimonyReward
        context: ${data.context}
        coeff: 0.30
        mode: excess_over_gt_per_primitive
        excess_margin: 1
        gate: converged

      # Response-intent reward (logs under `intent_*` keys).
      # All five public metrics live on the [0, 1] scale so the same cap applies
      # uniformly:
      #   motion_full_angle         = full motion-subspace angle in [0,1]
      #   motion_relational_angle   = raw motion-relational angle / mode-specific
      #                               maximum, in [0,1]
      #   leak_relational_angle     = relation-leak angle in [0,1]
      #   response_full_angle       = sqrt((motion_full_angle^2 + leak^2) / 2)
      #   response_relational_angle = sqrt((motion_relational_angle^2 + leak^2) / 2)
      #   (response_* metrics are normalized by sqrt(2) so they also fit [0,1].)
      - _target_: src.models.rewards.response_metric_reward.ResponseIntentReward
        context: ${data.context}
        eps: 1.0e-9
        coeff_h_angle: 2.0
        cap_h_angle: 1.0
        h_angle_reward_metric: response_relational_angle
        motion_relational_angle_mode: symmetric     # symmetric | pred_subset_gt | mixed_subset
        motion_relational_reverse_weight: 0.5

      # Intrinsic-size attainability bonus (gain_intrinsic). Disabled by
      # default; enable after smoke-testing the relation-intent reward.
      - _target_: src.models.rewards.gain_intrinsic.GainIntrinsicReward
        context: ${data.context}
        coeff: 3.0
        cap: 0.5
        gate: fc
        enabled: false
  optimizer:
    lr: 1e-5

trainer:
  check_val_every_n_epoch: null
  val_check_interval: 100
  devices: 1
  max_epochs: 3

pretrained_ckpt_path: logs/train/runs/2026-05-02_20-35-42/checkpoints/epoch_29.ckpt
