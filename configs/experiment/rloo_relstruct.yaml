# @package _global_

# RLOO with reward-Hθ + dimensional parsimony.
#
# Default reward-Hθ lives in ResponseMetricReward:
#   sqrt(d_relstruct^2 + leak_angle^2)
# where d_relstruct is the relation-only substitute for canonical d_sub_angle.
# RelStructReward owns only the GT-excess dimensional hinge by default.
#
# Staged rollout:
#   Step 1 (B2 legacy): leak only
#     conda run -n freecad python src/train.py experiment=rloo_relstruct \
#       model.relstruct_reward.use_dim_penalty=false \
#       model.reward.penalty_num_dimensional_constraints=-0.1
#   Step 1.5 (B2.5 legacy): leak + weak dimensional parsimony
#     conda run -n freecad python src/train.py experiment=rloo_relstruct \
#       model.relstruct_reward.coeff_dim_penalty=0.10 \
#       model.relstruct_reward.dim_penalty_mode=per_primitive
#   Step 1.6 (B2.6 stabilizer): leak_prime + GT-excess dimensional hinge
#     conda run -n freecad python src/train.py experiment=rloo_relstruct \
#       model.relstruct_reward.use_leak=true \
#       model.response_metric_reward.use_h_angle=false
#   Step 1.7 (reward-Hθ canary, default):
#       sqrt(d_relstruct^2 + leak_angle^2) + GT-excess dim hinge
#     conda run -n freecad python src/train.py experiment=rloo_relstruct
#     Full scalar Hθ ablation:
#       model.response_metric_reward.h_angle_reward_metric=d_H_angle
#   Step 1.8 (d_SVD ablation): add response-SVD bonus
#     conda run -n freecad python src/train.py experiment=rloo_relstruct \
#       model.response_metric_reward.use_d_svd=true \
#       model.response_metric_reward.d_svd_metric=d_SVD_sub_trunc
#   Step 2 (B3 legacy): add a separate RelStructReward d_relstruct bonus.
#     Do not enable together with default d_H_relstruct_angle unless this
#     double-counting is intentional; prefer changing
#       model.response_metric_reward.relstruct_distance_mode=mixed_subset
#       model.response_metric_reward.relstruct_reverse_weight=0.25
#     for pseudo-GT-tolerant relation structure.
#     conda run -n freecad python src/train.py experiment=rloo_relstruct \
#       model.response_metric_reward.h_angle_reward_metric=leak_angle \
#       model.relstruct_reward.use_relstruct=true
#   Step 3 (B4 full A″ legacy): + gain_intrinsic
#     conda run -n freecad python src/train.py experiment=rloo_relstruct \
#       model.response_metric_reward.h_angle_reward_metric=leak_angle \
#       model.relstruct_reward.use_relstruct=true \
#       model.relstruct_reward.use_gain=true
#
# Smoke test (CPU, 2 steps):
#   conda run -n freecad python src/train.py experiment=rloo_relstruct \
#     trainer.accelerator=cpu trainer.devices=1 trainer.strategy=auto trainer.precision=32 \
#     data.batch_size=1 model.group_sample_size=2 \
#     +trainer.max_steps=2 +trainer.limit_val_batches=0 +trainer.num_sanity_val_steps=0

defaults:
  - override /data: constraint_rloo.yaml
  - override /model: constraint_ar_rloo_relstruct.yaml
  - override /trainer: default

tags: ["rloo", "relstruct"]

callbacks:
  model_checkpoint_epoch:
    every_n_train_steps: 100
    save_top_k: 3
    filename: "epoch_{epoch}_step_{step}"

  model_checkpoint_loss: null

  model_checkpoint_reward:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    dirpath: ${paths.output_dir}/checkpoints
    monitor: "validation_gen/solver_fc_rate"
    filename: "step_{step}_fc_{validation_gen/solver_fc_rate:.3f}"
    save_top_k: 3
    mode: "max"
    auto_insert_metric_name: false
    every_n_train_steps: 100

data:
  # Pseudo-relational dataset generated by scripts/generate_pseudo_rel_dataset.py.
  # Each sketch in this npy carries model-predicted relational constraints as GT,
  # providing a denser R_G (preservation set) for the d_feas leak signal.
  # Generation: ~30 h on cuda:1 → PID 1849277 (started 2026-05-18).
  train_sequence_file: data_processed/sg_pseudo_rel_167k_unique_valid.npy
  batch_size: 32
  num_workers: 1

model:
  optimizer:
    lr: 1e-5
  gt_reward_coeff: 0.0

trainer:
  check_val_every_n_epoch: null
  val_check_interval: 100
  devices: 1
  max_epochs: 3

pretrained_ckpt_path: logs/train/runs/2026-05-02_20-35-42/checkpoints/epoch_29.ckpt
