# @package _global_
#
# ===== scaffold-v12 (2026-06-16): DimPrior Distance-penalty RELAX (S_place probe) =====
# Single-variable child of rloo_response_scaffold12_m4.5_l1.5_leakdof_dimprior_intent
# (run 28xstb2f). ONLY change: DimPrior Distance coeff -0.03 -> -0.015 (half).
#
# Motivation (eval on fiverr held-out, 2026-06-16): the full DimPrior drives raw
# diagonal `Distance` to ~0 (model 1.4% of constraints) while humans use diagonal
# Distance ~5.4% of constraints (~22% of their dimensions, comparable to DistanceX/Y).
# Decomposing one human diagonal Distance into axis X+Y changes the dimensional
# motion DIRECTIONS, so S_place (asgn_sim) drops: the leak arms sit ~0.06 below the
# motion-only arm (OURS .598 vs ablA_+M .665). This is a DimPrior over-correction,
# NOT a train-test gap (Distance rate is ~0 on both train and val).
#
# Hypothesis: halving the Distance penalty lets the policy keep legitimate diagonal
# Distance on diagonal edges, recovering S_place and the human raw-Distance:axis
# balance (target ~0.42 vs OURS ~0.07), WITHOUT reviving substitution leak (leak is
# guarded separately by LeakAngleReward gate=dof + SolverReward redundant penalty).
#
# Judge vs 28xstb2f at MATCHED step: asgn_sim UP toward ablA_+M, raw_distance_ratio
# UP toward human (~0.05), leak NOT worse (alarm if leak climbs back toward .30),
# distFam not blown out, FC/valid_dof_mean stable. Everything else is identical to
# the parent for clean single-knob attribution.
#
# Launch (GPU): conda run -n freecad python src/train.py experiment=rloo_response_scaffold12_m4.5_l1.5_leakdof_dimprior_distrelax_intent trainer.devices=[N]
# Smoke (CPU, 2 steps):
#   conda run -n freecad python src/train.py experiment=rloo_response_scaffold12_m4.5_l1.5_leakdof_dimprior_distrelax_intent \
#     trainer.accelerator=cpu trainer.devices=1 trainer.strategy=auto trainer.precision=32 \
#     data.batch_size=1 model.group_sample_size=3 \
#     +trainer.max_steps=2 +trainer.limit_val_batches=0 +trainer.num_sanity_val_steps=0
#
# ---- parent header (m4.5 + l1.5 leakdof + DimPrior FULL STACK) retained below ----
# = scaffold12_m4.5_l1.5_leakdof_intent PLUS DimPrior (Distance/Angle neg, DistanceX/Y pos).
# motion_relational stays gate=converged; leak weighted continuously by dof_reduction_rate:
#   clip((orig_dof - DoF) / (orig_dof - fully_constrained_dof), 0, 1)
# Judge: solver_valid_dof_mean DOWN + FC UP with distFam/leak < sc7; dimP>=~2 collapse
# alarm. NOT respF (pro-dim). v2 GT closure (1.67M), flip [x,y], symmetric mode.

defaults:
  - override /data: constraint_rloo.yaml
  - override /model: constraint_ar_rloo.yaml
  - override /trainer: default

tags: ["rloo", "response", "scaffold12", "v2gt", "flip", "intent", "dimprior", "distrelax", "splace"]

callbacks:
  model_checkpoint_epoch:
    every_n_train_steps: 100
    save_top_k: 3
    filename: "epoch_{epoch}_step_{step}"
    save_last: true

  model_checkpoint_loss: null

  model_checkpoint_reward:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    dirpath: ${paths.output_dir}/checkpoints
    monitor: "validation_gen/solver_valid_dof_mean"
    filename: "step_{step}_dof_{validation_gen/solver_valid_dof_mean:.3f}"
    save_top_k: 3
    mode: "min"
    auto_insert_metric_name: false
    every_n_train_steps: 100

  # Fixed-interval, NON-overwriting checkpoints for matched-step ablation eval.
  model_checkpoint_step:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    dirpath: ${paths.output_dir}/checkpoints
    filename: "stepsave_{step}"
    every_n_train_steps: 5000
    save_top_k: -1
    save_last: false
    auto_insert_metric_name: false

data:
  train_sequence_file: data_processed/sg_pseudo_rel_v2_full_all_full.npy
  batch_size: 32
  num_workers: 1

model:
  flip_augment_axes: [x, y]
  group_sample_size: 9

  entropy_bonus: 0.005
  train_sample_temperature: 1.2
  val_sample_temperature: 1.0

  reward_composer:
    _target_: src.models.rewards.composer.RewardComposer
    rewards:
      - _target_: src.models.rewards.solver_reward.SolverReward
        context: ${data.context}
        reward_dof_reduction: 4.0
        reward_fully_constrained: 1.5
        penalty_conflicting: -1.0
        penalty_redundant: -1.0
        penalty_malformed: -0.5
        penalty_deformed: -0.25
        penalty_per_problematic_constraint: -1.0
        penalty_rigid_dimensional: -0.0
        fully_constrained_dof: 2
        distortion_threshold: null
        penalty_near_zero_distance: -1.5
        near_zero_distance_threshold: 0.001
        near_zero_distance_cap: 3
        near_zero_distance_gate: converged
        penalty_axis_angle: -1.5
        axis_angle_tolerance_rad: 0.001
        axis_angle_cap: 3
        axis_angle_gate: converged
        num_workers: null

      - _target_: src.models.rewards.relational_class_prior.RelationalClassPriorReward
        context: ${data.context}
        gate: converged
        cap_total: 1.0
        cap_per_type: 3
        coeff_by_type:
          Mirror: 0.15
          Equal: 0.129
          Concentric: 0.055
          Parallel: 0.053
          Perpendicular: 0.046
          Tangent: 0.048
          Coincident: 0.012
          Horizontal: 0.042
          Vertical: 0.05
          Midpoint: 0.112

      # DimPrior — SINGLE-VARIABLE CHANGE vs parent: Distance -0.03 -> -0.015 (half).
      # Relax the diagonal-Distance penalty so the policy can keep legitimate human
      # diagonal Distance (~5.4% of human constraints) instead of decomposing it into
      # axis X/Y, which is what depresses S_place. DistanceX/Y/Angle UNCHANGED.
      - _target_: src.models.rewards.dimensional_class_prior.DimensionalClassPriorReward
        context: ${data.context}
        gate: converged
        cap_positive_total: 0.10
        cap_negative_total: -0.20
        cap_per_type: 3
        coeff_by_type:
          Distance: -0.01
          DistanceX: 0.02
          DistanceY: 0.02
          Angle: -0.05

      - _target_: src.models.rewards.response_metric_reward.ResponseMetricEvaluator
        context: ${data.context}
        eps: 1.0e-9
        motion_relational_angle_mode: symmetric
        motion_relational_reverse_weight: 0.5
        gate: converged
        num_workers: 4
      - _target_: src.models.rewards.response_metric_reward.MotionAngleReward
        coeff: 4.5
        cap: 0.70
        gate: converged
      - _target_: src.models.rewards.response_metric_reward.LeakAngleReward
        coeff: 1.5
        cap: 0.70
        gate: dof

  # Val composer LEFT IDENTICAL to the parent (eval must not move with the treatment).
  reward_val_composer:
    _target_: src.models.rewards.composer.RewardValComposer
    context: ${data.context}
    metrics:
      - _target_: src.models.rewards.solver_reward.SolverReward
        context: ${data.context}
        fully_constrained_dof: 2
        penalty_near_zero_distance: 0.0
        near_zero_distance_threshold: 0.001
        penalty_axis_angle: 0.0
        axis_angle_tolerance_rad: 0.001
        num_workers: null
      - _target_: src.models.rewards.response_metric_reward.ResponseMetricEvaluator
        context: ${data.context}
        eps: 1.0e-9
        gate: always
        num_workers: 0
      - _target_: src.models.rewards.relational_class_prior.RelationalClassPriorReward
        context: ${data.context}
        gate: always
        cap_total: 1.0
        cap_per_type: 3
        coeff_by_type:
          Mirror: 0.15
          Equal: 0.129
          Concentric: 0.055
          Parallel: 0.053
          Perpendicular: 0.046
          Tangent: 0.048
          Coincident: 0.012
          Horizontal: 0.042
          Vertical: 0.05
          Midpoint: 0.112

  optimizer:
    lr: 1e-5

trainer:
  check_val_every_n_epoch: null
  val_check_interval: 100
  devices: 1
  max_epochs: 3

pretrained_ckpt_path: logs/train/runs/2026-05-02_20-35-42/checkpoints/epoch_29.ckpt
