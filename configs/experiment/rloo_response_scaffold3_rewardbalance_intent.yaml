# @package _global_

# scaffold-v3 PROBE (A) — REWARD-BALANCE, retargeted by the 2026-05-31 diagnostics
# (research plan §14.7.5, item "probe A").
#
# This is an EXPLORATORY probe on the v1 reward GT (sg_pseudo_rel_167k) + the same
# abs-pos pretrain — NOT the controlled S-vs-R ablation (the reward stack changes,
# so do not use it for the scaffold2 comparison).  Goal: can a reward rebalance,
# with NO augmenter and NO retraining of the GT, lift the *non-substitutable*
# under-produced relations (Tangent / Perpendicular / Equal)?
#
# Why these knobs (diagnostics, not guesswork):
#   * #2 measured SolverReward {H,H}=2x{Parallel}; and that d_H_angle is gauge-
#     invariant so it CANNOT and NEED NOT distinguish Parallel from H+H — Parallel
#     absence is benign.  => we deliberately do NOT boost Parallel.
#   * #3 ranked marginal d_H_angle importance on human GT: Tangent 0.52 >
#     Perpendicular 0.45 > Equal 0.39 (all non-substitutable, all under-produced
#     ~5-10x below GT).  These are the real targets.
#   * #1 + #2: Tangent/Equal lose to a SolverReward "drag" (a slightly-off tangency
#     -> Distorted -> penalty; solver contrib -1.9..-2.8) that the intent reward
#     (+1.1 train, only -0.4 on fiverr) fails to outweigh, esp. on OOD human data.
# Levers (all reward-side, augmenter-independent):
#   1. coeff_h_angle 3 -> 8 (+ cap 0.70 -> 0.85): make the intent pull outweigh the
#      solver drag on the non-substitutable relations.
#   2. rel_prior Tangent/Perpendicular/Equal 0.046-0.129 -> 0.30 (x2.3-6.5),
#      cap_per_type 3 -> 4: a direct sampling nudge for exactly the high-importance
#      types (Parallel left low — benign).
#   3. SolverReward penalty_deformed -0.25 -> 0.0: de-risk a near-miss tangency so a
#      geometrically-intended Tangent on imperfect human geometry is not punished.
#
# Smoke test (CPU, 2 steps):
#   conda run -n freecad python src/train.py experiment=rloo_response_scaffold3_rewardbalance_intent \
#     trainer.accelerator=cpu trainer.devices=1 trainer.strategy=auto trainer.precision=32 \
#     data.batch_size=1 model.group_sample_size=2 \
#     +trainer.max_steps=2 +trainer.limit_val_batches=0 +trainer.num_sanity_val_steps=0
# Launch (GPU): conda run -n freecad python src/train.py experiment=rloo_response_scaffold3_rewardbalance_intent

defaults:
  - override /data: constraint_rloo.yaml
  - override /model: constraint_ar_rloo.yaml
  - override /trainer: default

tags: ["rloo", "response", "scaffold3", "rewardbalance", "intent", "probe"]

callbacks:
  model_checkpoint_epoch:
    every_n_train_steps: 100
    save_top_k: 3
    filename: "epoch_{epoch}_step_{step}"
    save_last: true

  model_checkpoint_loss: null

  model_checkpoint_reward:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    dirpath: ${paths.output_dir}/checkpoints
    monitor: "validation_gen/solver_valid_dof_mean"
    filename: "step_{step}_dof_{validation_gen/solver_valid_dof_mean:.3f}"
    save_top_k: 3
    mode: "min"
    auto_insert_metric_name: false
    every_n_train_steps: 100

data:
  train_sequence_file: data_processed/sg_pseudo_rel_167k_unique_valid.npy
  batch_size: 32
  num_workers: 1

model:
  # Exploration knobs held at scaffold-v2 levels: this probe isolates reward
  # BALANCE, not exploration strength (that is scaffold3_explore_intent).
  entropy_bonus: 0.005
  train_sample_temperature: 1.2
  val_sample_temperature: 1.0

  reward_composer:
    _target_: src.models.rewards.composer.RewardComposer
    rewards:
      - _target_: src.models.rewards.solver_reward.SolverReward
        context: ${data.context}
        reward_dof_reduction: 10.0
        reward_fully_constrained: 5.0
        penalty_conflicting: -1.0
        penalty_redundant: -1.0
        penalty_malformed: -0.5
        # PROBE: -0.25 -> 0.0 — stop punishing a near-miss tangency (Distorted),
        # the measured Tangent solver-drag (#2: correct +2.00 vs near-miss -0.25).
        penalty_deformed: -0.0
        penalty_per_problematic_constraint: -1.0
        penalty_rigid_dimensional: -0.0
        fully_constrained_dof: 2
        distortion_threshold: null
        penalty_near_zero_distance: -1.5
        near_zero_distance_threshold: 0.001
        near_zero_distance_cap: 3
        near_zero_distance_gate: converged
        penalty_axis_angle: -1.5
        axis_angle_tolerance_rad: 0.001
        axis_angle_cap: 3
        axis_angle_gate: converged
        num_workers: null

      - _target_: src.models.rewards.dim_parsimony.DimParsimonyReward
        context: ${data.context}
        coeff: 0.30
        mode: excess_over_gt_per_primitive
        excess_margin: 1
        gate: converged

      # PROBE: boost ONLY the non-substitutable, under-produced types (#3 ranking);
      # Parallel stays low (benign per #2). cap_per_type 3 -> 4.
      - _target_: src.models.rewards.relational_class_prior.RelationalClassPriorReward
        context: ${data.context}
        gate: converged
        cap_total: 1.0
        cap_per_type: 4
        coeff_by_type:
          Mirror: 0.15
          Equal: 0.30
          Concentric: 0.055
          Parallel: 0.053
          Perpendicular: 0.30
          Tangent: 0.30
          Coincident: 0.012
          Horizontal: 0.042
          Vertical: 0.05
          Midpoint: 0.112

      # PROBE: coeff 3 -> 8, cap 0.70 -> 0.85 so intent outweighs the solver drag.
      - _target_: src.models.rewards.response_metric_reward.ResponseIntentReward
        context: ${data.context}
        eps: 1.0e-9
        coeff_h_angle: 8.0
        cap_h_angle: 0.85
        h_angle_reward_metric: motion_relational_angle
        motion_relational_angle_mode: symmetric
        motion_relational_reverse_weight: 0.5
        gate: converged
        num_workers: 4

  # Val composer LEFT IDENTICAL to scaffold2 so validation_gen/* stays comparable
  # across the scaffold2 / scaffold3 runs (eval must not move with the treatment).
  reward_val_composer:
    _target_: src.models.rewards.composer.RewardValComposer
    context: ${data.context}
    metrics:
      - _target_: src.models.rewards.solver_reward.SolverReward
        context: ${data.context}
        fully_constrained_dof: 2
        penalty_near_zero_distance: 0.0
        near_zero_distance_threshold: 0.001
        penalty_axis_angle: 0.0
        axis_angle_tolerance_rad: 0.001
        num_workers: null
      - _target_: src.models.rewards.response_metric_reward.ResponseIntentReward
        context: ${data.context}
        eps: 1.0e-9
        gate: always
        h_angle_reward_metric: response_full_angle
        num_workers: 0
      - _target_: src.models.rewards.relational_class_prior.RelationalClassPriorReward
        context: ${data.context}
        gate: always
        cap_total: 1.0
        cap_per_type: 3
        coeff_by_type:
          Mirror: 0.15
          Equal: 0.129
          Concentric: 0.055
          Parallel: 0.053
          Perpendicular: 0.046
          Tangent: 0.048
          Coincident: 0.012
          Horizontal: 0.042
          Vertical: 0.05
          Midpoint: 0.112

  optimizer:
    lr: 1e-5

trainer:
  check_val_every_n_epoch: null
  val_check_interval: 100
  devices: 1
  max_epochs: 3

pretrained_ckpt_path: logs/train/runs/2026-05-02_20-35-42/checkpoints/epoch_29.ckpt
