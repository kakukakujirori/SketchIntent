# @package _global_

# scaffold-v2 + ResponseIntentReward, trained against pseudo-GT v2 with Mirror
# removed.  This keeps the same generated closure as the full_all arm except for
# Mirror, whose fiverr precision was very low at the selected tolerance.

defaults:
  - rloo_response_scaffold2_intent
  - _self_

tags: ["rloo", "response", "scaffold2", "intent", "pseudo_rel_v2", "no_mirror"]

data:
  train_sequence_file: data_processed/sg_pseudo_rel_v2_no_mirror.npy
