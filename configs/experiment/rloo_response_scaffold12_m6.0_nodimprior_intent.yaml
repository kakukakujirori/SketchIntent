# @package _global_
#
# ===== scaffold-v12 CONTROL (2026-06-14): m6.0, DimPrior REMOVED =====
# Refactor-equivalence control.  This is rloo_response_scaffold12_m6.0_dimprior_intent
# with the DimensionalClassPriorReward block deleted and NOTHING else changed.
#
# Purpose: scaffold12 expresses the intent reward through the DECOMPOSED API
# (ResponseMetricEvaluator producer + MotionAngleReward consumer on
# motion_relational_angle, coeff 6 / cap 0.70 / gate converged), whereas
# scaffold8_fc10_hicoeff used the monolithic ResponseIntentReward
# (h_angle_reward_metric=motion_relational_angle, coeff_h_angle 6 / cap 0.70 /
# gate converged).  With DimPrior gone, the two configs are reward-semantically
# identical, so THIS run must reproduce scaffold8_fc10_hicoeff (kmcne55j).
#
# Read of the result:
#   * Matches kmcne55j (DoF descends to ~5.7, FC -> ~0.4, distFam climbs to ~0.16
#     by step ~40k; at matched steps DoF/FC/distFam track kmcne55j) =>
#     the ResponseIntentReward -> ResponseMetricEvaluator+MotionAngleReward
#     refactor is behavior-preserving, and DimClassPrior is the SOLE cause of the
#     under-constrained固着 seen in m6.0_dimprior (a1e6s9en).
#   * Diverges from kmcne55j (e.g. stays under-constrained like a1e6s9en, or the
#     motion_intent reward never fires) => the refactor changed semantics.
#     Prime suspects: async ordering (MotionAngleReward consuming
#     ctx.h_theta_metrics BEFORE ResponseMetricEvaluator.collect_results
#     populates it), gate handling, or the producer writing a None cache entry.
#     Check train/motion_intent_reward_mean (must be > 0 and rising like
#     scaffold8's train/intent_reward_mean) and train/reward_contrib_motion_intent_seq_mean.
#
# Compare-against: kmcne55j (rloo_response_scaffold8_fc10_hicoeff_intent) and
# a1e6s9en (rloo_response_scaffold12_m6.0_dimprior_intent).
# Smoke (CPU, 2 steps):
#   conda run -n freecad python src/train.py experiment=rloo_response_scaffold12_m6.0_nodimprior_intent \
#     trainer.accelerator=cpu trainer.devices=1 trainer.strategy=auto trainer.precision=32 \
#     data.batch_size=1 model.group_sample_size=3 \
#     +trainer.max_steps=2 +trainer.limit_val_batches=0 +trainer.num_sanity_val_steps=0
# Launch: conda run -n freecad python src/train.py experiment=rloo_response_scaffold12_m6.0_nodimprior_intent trainer.devices=[N]
# ---- original scaffold12 / scaffold8 / scaffold7 / scaffold6 headers omitted; see
#      rloo_response_scaffold12_m6.0_dimprior_intent.yaml for full provenance. ----

defaults:
  - override /data: constraint_rloo.yaml
  - override /model: constraint_ar_rloo.yaml
  - override /trainer: default

tags: ["rloo", "response", "scaffold12", "control", "nodimprior", "refactor-equiv", "intent"]

callbacks:
  model_checkpoint_epoch:
    every_n_train_steps: 100
    save_top_k: 3
    filename: "epoch_{epoch}_step_{step}"
    save_last: true

  model_checkpoint_loss: null

  model_checkpoint_reward:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    dirpath: ${paths.output_dir}/checkpoints
    monitor: "validation_gen/solver_valid_dof_mean"
    filename: "step_{step}_dof_{validation_gen/solver_valid_dof_mean:.3f}"
    save_top_k: 3
    mode: "min"
    auto_insert_metric_name: false
    every_n_train_steps: 100

data:
  train_sequence_file: data_processed/sg_pseudo_rel_v2_full_all_full.npy
  batch_size: 32
  num_workers: 1

model:
  # PHASE 2: flip-augmented rollouts (the counterfactual generator) + even 3-way split.
  flip_augment_axes: [x, y]
  group_sample_size: 9

  entropy_bonus: 0.005
  train_sample_temperature: 1.2
  val_sample_temperature: 1.0

  reward_composer:
    _target_: src.models.rewards.composer.RewardComposer
    rewards:
      - _target_: src.models.rewards.solver_reward.SolverReward
        context: ${data.context}
        # PHASE 2: compress the solver dynamic range (alpha ~= 0.4), as in scaffold4.
        reward_dof_reduction: 4.0
        # scaffold8 FC=1.0 hinge + intent bend (coeff 6 below).
        reward_fully_constrained: 1.0
        penalty_conflicting: -1.0
        penalty_redundant: -1.0
        penalty_malformed: -0.5
        penalty_deformed: -0.25
        penalty_per_problematic_constraint: -1.0
        penalty_rigid_dimensional: -0.0
        fully_constrained_dof: 2
        distortion_threshold: null
        penalty_near_zero_distance: -1.5
        near_zero_distance_threshold: 0.001
        near_zero_distance_cap: 3
        near_zero_distance_gate: converged
        penalty_axis_angle: -1.5
        axis_angle_tolerance_rad: 0.001
        axis_angle_cap: 3
        axis_angle_gate: converged
        num_workers: null

      - _target_: src.models.rewards.dim_parsimony.DimParsimonyReward
        context: ${data.context}
        coeff: 0.30
        mode: excess_over_gt_per_primitive
        excess_margin: 1
        gate: converged

      - _target_: src.models.rewards.relational_class_prior.RelationalClassPriorReward
        context: ${data.context}
        gate: converged
        cap_total: 1.0
        cap_per_type: 3
        coeff_by_type:
          Mirror: 0.15
          Equal: 0.129
          Concentric: 0.055
          Parallel: 0.053
          Perpendicular: 0.046
          Tangent: 0.048
          Coincident: 0.012
          Horizontal: 0.042
          Vertical: 0.05
          Midpoint: 0.112

      # DimensionalClassPriorReward DELIBERATELY ABSENT — this is the only
      # difference vs rloo_response_scaffold12_m6.0_dimprior_intent.

      - _target_: src.models.rewards.response_metric_reward.ResponseMetricEvaluator
        context: ${data.context}
        eps: 1.0e-9
        motion_relational_angle_mode: symmetric
        motion_relational_reverse_weight: 0.5
        gate: converged
        num_workers: 4

      - _target_: src.models.rewards.response_metric_reward.MotionAngleReward
        coeff: 6.0
        cap: 0.70
        gate: converged

  # Val composer LEFT IDENTICAL to scaffold2 (eval must not move with the treatment).
  reward_val_composer:
    _target_: src.models.rewards.composer.RewardValComposer
    context: ${data.context}
    metrics:
      - _target_: src.models.rewards.solver_reward.SolverReward
        context: ${data.context}
        fully_constrained_dof: 2
        penalty_near_zero_distance: 0.0
        near_zero_distance_threshold: 0.001
        penalty_axis_angle: 0.0
        axis_angle_tolerance_rad: 0.001
        num_workers: null
      - _target_: src.models.rewards.response_metric_reward.ResponseMetricEvaluator
        context: ${data.context}
        eps: 1.0e-9
        gate: always
        num_workers: 0
      - _target_: src.models.rewards.relational_class_prior.RelationalClassPriorReward
        context: ${data.context}
        gate: always
        cap_total: 1.0
        cap_per_type: 3
        coeff_by_type:
          Mirror: 0.15
          Equal: 0.129
          Concentric: 0.055
          Parallel: 0.053
          Perpendicular: 0.046
          Tangent: 0.048
          Coincident: 0.012
          Horizontal: 0.042
          Vertical: 0.05
          Midpoint: 0.112

  optimizer:
    lr: 1e-5

trainer:
  check_val_every_n_epoch: null
  val_check_interval: 100
  devices: 1
  max_epochs: 3

pretrained_ckpt_path: logs/train/runs/2026-05-02_20-35-42/checkpoints/epoch_29.ckpt
