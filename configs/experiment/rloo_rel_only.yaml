# @package _global_

# to execute this experiment run:
# python train.py experiment=rloo_rel_only

defaults:
  - override /data: constraint_rloo.yaml
  - override /model: constraint_ar_rloo.yaml
  - override /trainer: default
  # - override /callbacks: null  # COMMENT OUT!!!
  # - override /logger: null  # COMMENT OUT!!!

tags: ["rloo", "rel_only"]

callbacks:
  model_checkpoint_epoch:
    every_n_train_steps: 1000
    save_top_k: 3
    filename: "epoch_{epoch}_step_{step}"
    save_last: true

  model_checkpoint_loss: null

  model_checkpoint_reward:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    dirpath: ${paths.output_dir}/checkpoints
    monitor: "validation_gen/solver_valid_dof_mean"
    filename: "step_{step}_dof_{validation_gen/solver_valid_dof_mean:.3f}"
    save_top_k: 3
    mode: "min"
    auto_insert_metric_name: false
    every_n_train_steps: 1000

  model_checkpoint_undistorted:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    dirpath: ${paths.output_dir}/checkpoints
    monitor: "validation_gen/solver_distorted_rate"
    filename: "step_{step}_distorted_{validation_gen/solver_distorted_rate:.3f}"
    save_top_k: 3
    mode: "min"
    auto_insert_metric_name: false
    every_n_train_steps: 1000

data:
  context:
    max_token_length: 130  # 192 collapsed
  batch_size: 32
  num_workers: 1  # Less is better since this RL training is compute-bound
  relational_only: true

model:
  optimizer:
    lr: 1e-5
  gt_reward_coeff: 0.0
  relational_only: true

trainer:
  check_val_every_n_epoch: null
  val_check_interval: 100
  devices: 1  # Under a lot of CPU-GPU communication, distributed training slows runs
  max_epochs: 3

pretrained_ckpt_path: logs/train/runs/2026-05-16_12-06-49/checkpoints/epoch_29.ckpt
